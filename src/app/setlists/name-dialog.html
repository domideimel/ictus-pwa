<dialog
  #dialog
  class="m-auto w-[min(20rem,calc(100vw-2rem))] rounded-2xl border border-stroke bg-surface p-0 text-fg"
  aria-labelledby="name-dialog-title"
  (close)="closed.emit()"
>
  <!-- novalidate: the form shows its own messages instead of the browser bubble. -->
  <form class="flex flex-col gap-4 p-5" novalidate (submit)="save($event)">
    <h2 id="name-dialog-title" class="text-center text-17 font-semibold">{{ title() }}</h2>
    <label class="flex flex-col gap-1.5 text-sm text-muted">
      Name
      <input
        #input
        type="text"
        autocomplete="off"
        enterkeyhint="done"
        class="h-11 rounded-10 border border-stroke bg-bg px-3 text-base text-fg"
        aria-describedby="name-dialog-error"
        [formField]="nameForm.name"
        [attr.aria-invalid]="showError()"
      />
    </label>
    <p id="name-dialog-error" class="-mt-2 min-h-4 text-xs text-accent-text" aria-live="polite">
      @if (showError()) {
        {{ nameForm.name().errors()[0]?.message }}
      }
    </p>
    <div class="grid grid-cols-2 gap-2">
      <button
        type="button"
        appSurface
        class="h-11 rounded-xl font-semibold"
        (click)="dialog.close()"
      >
        Cancel
      </button>
      <button type="submit" class="h-11 rounded-xl bg-accent font-semibold text-on-accent">
        Save
      </button>
    </div>
  </form>
</dialog>
