<lg-dialog [(open)]="open" (closed)="closed.emit()">
  <!-- The dialog focuses the name when it opens; (focus) selects it, ready to type over. -->
  <!-- novalidate: the form field shows its own messages instead of the browser bubble. -->
  <form class="flex flex-col gap-6" novalidate (submit)="save($event)">
    <h2 lgDialogTitle class="mb-0!">{{ title() }}</h2>
    <lg-form-field>
      <label lgLabel for="name-dialog-name">Name</label>
      <input
        #input
        id="name-dialog-name"
        lgInput
        type="text"
        autocomplete="off"
        enterkeyhint="done"
        [formField]="nameForm.name"
        (focus)="input.select()"
      />
    </lg-form-field>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" lgButton lgDialogClose>Cancel</button>
      <button type="submit" lgButton variant="accent">Save</button>
    </div>
  </form>
</lg-dialog>
