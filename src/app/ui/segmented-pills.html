<fieldset lgSegmented class="w-full" [disabled]="disabled()">
  <legend>{{ label() }}</legend>
  @for (option of options(); track option.value) {
    <label lgSegment class="flex-1 truncate">
      <input
        type="radio"
        [name]="groupName"
        [checked]="option.value === value()"
        (change)="value.set(option.value)"
      />
      {{ option.label }}
    </label>
  }
</fieldset>
