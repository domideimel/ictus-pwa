<button
  type="button"
  role="switch"
  class="relative h-7.75 w-12.75 rounded-full transition-colors disabled:opacity-40"
  [class]="checked() ? 'bg-accent' : 'bg-stroke'"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label()"
  [disabled]="disabled()"
  (click)="checked.set(!checked())"
>
  <span
    class="absolute top-0.5 left-0.5 size-6.75 rounded-full bg-white shadow transition-transform motion-reduce:transition-none"
    [class.translate-x-5]="checked()"
  ></span>
</button>
