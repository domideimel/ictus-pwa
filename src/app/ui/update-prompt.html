<dialog
  #dialog
  class="m-auto w-[min(21rem,calc(100vw-2rem))] rounded-20 border border-stroke bg-surface p-0 text-fg"
  aria-labelledby="update-title"
  aria-describedby="update-text"
  (close)="dismissed.set(true)"
>
  <div class="flex flex-col gap-4 p-5">
    <div class="flex flex-col gap-1.5 text-center">
      <h2 id="update-title" class="text-17 font-semibold">Update available</h2>
      <p id="update-text" class="text-15 text-muted">
        {{
          broken()
            ? 'This version of Ictus can no longer load all of its files. Reload to continue.'
            : 'A new version of Ictus is ready. Reload to use it; your settings and setlists stay.'
        }}
      </p>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button
        type="button"
        appSurface
        class="h-11 rounded-xl font-semibold"
        (click)="dialog.close()"
      >
        Later
      </button>
      <button
        type="button"
        class="h-11 rounded-xl bg-accent font-semibold text-on-accent"
        (click)="reload()"
      >
        Reload
      </button>
    </div>
  </div>
</dialog>
