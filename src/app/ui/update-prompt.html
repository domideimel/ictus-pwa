<lg-dialog alert [open]="show()" (closed)="dismissed.set(true)">
  <h2 lgDialogTitle>{{ broken() ? 'Reload needed' : 'Update available' }}</h2>
  <p lgDialogDescription class="mb-6 text-lg-fg-muted">
    {{
      broken()
        ? 'This version of Ictus can no longer load all of its files. Reload to continue.'
        : 'A new version of Ictus is ready. Reload to use it; your settings and setlists stay.'
    }}
  </p>
  <div class="grid grid-cols-2 gap-2">
    <button type="button" lgButton lgDialogClose>Later</button>
    <button type="button" lgButton variant="accent" (click)="reload()">Reload</button>
  </div>
</lg-dialog>
