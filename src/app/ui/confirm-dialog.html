<lg-dialog alert [(open)]="open" (closed)="closed.emit()">
  <h2 lgDialogTitle>{{ title() }}</h2>
  <p lgDialogDescription class="mb-6 text-lg-fg-muted">{{ message() }}</p>
  <div class="grid grid-cols-2 gap-2">
    <!-- autofocus: Cancel comes first, so Enter or a stray tap doesn't confirm. -->
    <!-- eslint-disable-next-line @angular-eslint/template/no-autofocus -->
    <button type="button" lgButton lgDialogClose autofocus>Cancel</button>
    <button type="button" lgButton [variant]="danger() ? 'danger' : 'accent'" (click)="confirm()">
      {{ action() }}
    </button>
  </div>
</lg-dialog>
