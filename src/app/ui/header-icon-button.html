<button
  type="button"
  lgButton
  shape="circle"
  class="relative"
  [attr.aria-label]="fullLabel()"
  (click)="pressed.emit()"
>
  <app-icon [name]="icon()" />
  @if (badge() > 0) {
    <!-- The count is in the button's name too; the badge only shows it. -->
    <span
      class="absolute -end-1 -top-1 flex h-4.5 min-w-4.5 items-center justify-center rounded-full bg-lg-accent px-1 text-xs font-bold text-lg-on-accent tabular-nums"
      aria-hidden="true"
    >
      {{ badge() }}
    </span>
  }
</button>
