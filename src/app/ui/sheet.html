<lg-dialog placement="sheet" dismissible [(open)]="open" (closed)="closed.emit()">
  <header class="-mt-2 mb-2 flex items-center gap-2">
    <h2 lgDialogTitle class="mb-0!">{{ title() }}</h2>
    <span class="flex-1"></span>
    <ng-content select="[sheetAccessory]" />
    <button
      type="button"
      lgButton
      lgDialogClose
      variant="ghost"
      shape="circle"
      class="-me-3"
      [attr.aria-label]="closeLabel()"
    >
      <app-icon name="close" />
    </button>
  </header>
  <ng-content />
</lg-dialog>
