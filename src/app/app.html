@if (viewport.isWide()) {
  <app-combined-view />
} @else {
  <main class="flex min-h-0 flex-1 flex-col">
    <router-outlet />
  </main>
  <nav
    class="grid shrink-0 grid-cols-2 border-t border-lg-border bg-lg-surface pt-1.5 lg-safe-bottom"
    aria-label="Screens"
  >
    @for (tab of tabs; track tab.path) {
      <!-- The active tab gets a tinted pill behind its icon, not just a colour change. -->
      <a
        routerLinkActive="is-active font-semibold text-lg-accent"
        ariaCurrentWhenActive="page"
        class="group flex flex-col items-center gap-1 py-1 text-xs font-medium text-lg-fg-muted"
        [routerLink]="tab.path"
      >
        <span
          class="flex h-8 w-16 items-center justify-center rounded-full group-[.is-active]:bg-lg-accent-surface"
        >
          <app-icon [name]="tab.icon" [size]="24" />
        </span>
        {{ tab.label }}
      </a>
    }
  </nav>
}

@if (ui.showSettings()) {
  <app-settings-sheet (closed)="ui.closeSettings()" />
}
@if (metronome.rest()) {
  <app-rest-counter />
}
<app-update-prompt />
