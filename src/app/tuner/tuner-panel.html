@if (wide()) {
  <section
    lgCard
    aria-labelledby="tuner-title"
    class="border border-lg-border bg-lg-surface lg:p-7"
  >
    <div class="flex flex-col gap-4">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <app-section-label id="tuner-title">Tuner</app-section-label>
        <div class="flex items-center gap-3">
          <app-reference-pitch-button />
          <app-tuner-toggle />
        </div>
      </header>
      <app-segmented-pills
        label="Tuner mode"
        [options]="modes"
        [value]="mode()"
        (valueChange)="setMode($event)"
      />
      @if (mode() === 'chromatic') {
        <div class="flex flex-col items-center gap-4">
          <app-staff-card class="w-full" />
          <div class="flex flex-wrap items-center justify-center gap-7">
            <app-note-name [size]="120" />
            <div class="flex flex-col gap-2.5">
              <app-tuning-state-pill class="self-start!" />
              <app-frequency-label />
            </div>
          </div>
          <app-cents-meter />
        </div>
      } @else {
        <app-drum-tuning />
      }
      @if (notice(); as notice) {
        <p class="self-center text-center text-sm text-lg-warning" role="status">{{ notice }}</p>
      }
    </div>
  </section>
} @else {
  <header class="flex items-center justify-between px-5 pt-3">
    <app-reference-pitch-button />
    <ng-content select="[headerEnd]" />
  </header>
  <app-segmented-pills
    class="mx-5 mt-3"
    label="Tuner mode"
    [options]="modes"
    [value]="mode()"
    (valueChange)="setMode($event)"
  />

  <!-- Focusable, so the keyboard can scroll it: the chromatic readout has no control inside. -->
  <div
    class="min-h-0 flex-1 overflow-y-auto overscroll-contain"
    tabindex="0"
    role="region"
    aria-label="Reading"
  >
    @if (mode() === 'chromatic') {
      <div class="flex flex-col items-center px-5 pt-4 pb-4">
        <app-staff-card class="w-full" />
        <app-note-name class="mt-4" [size]="phoneNote()" />
        <app-tuning-state-pill class="mt-3" />
        <app-cents-meter class="mt-4" />
        <app-frequency-label class="mt-2" />
      </div>
    } @else {
      <app-drum-tuning class="px-5 py-4" />
    }
    @if (notice(); as notice) {
      <p class="mx-auto max-w-xs px-5 pb-4 text-center text-sm text-lg-warning" role="status">
        {{ notice }}
      </p>
    }
  </div>

  <app-tuner-toggle class="border-t border-lg-border px-5 pt-3 pb-3" />
}
