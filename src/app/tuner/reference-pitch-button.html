<button
  type="button"
  lgButton
  class="rounded-full font-semibold tabular-nums"
  aria-haspopup="dialog"
  [attr.aria-label]="`Reference pitch: A = ${settings.referencePitch()} Hz`"
  (click)="editing.set(true)"
>
  A = {{ settings.referencePitch() }} Hz
  <app-icon name="chevron-down" class="text-lg-fg-muted" [size]="14" [strokeWidth]="2.2" />
</button>
@if (editing()) {
  <app-reference-pitch-sheet (closed)="editing.set(false)" />
}
