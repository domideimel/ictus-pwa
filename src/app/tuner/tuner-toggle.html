<button
  type="button"
  lgButton
  variant="accent"
  size="lg"
  class="w-full rounded-full font-semibold whitespace-nowrap"
  (click)="tuner.toggle()"
>
  <app-icon [name]="tuner.switchedOn() ? 'stop' : 'mic'" [size]="20" [strokeWidth]="2" />
  {{ tuner.switchedOn() ? 'Stop tuner' : 'Start tuner' }}
</button>
