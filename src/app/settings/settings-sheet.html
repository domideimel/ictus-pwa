<app-sheet title="Settings" (closed)="closed.emit()">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault()">
    <section class="flex flex-col gap-1.5" aria-labelledby="settings-appearance">
      <h3 id="settings-appearance" class="ps-1 text-xs tracking-wider text-lg-fg-muted uppercase">
        Appearance
      </h3>
      <lg-theme-switcher />
    </section>

    <app-settings-group title="Tuner">
      <app-settings-row label="Reference pitch" for="settings-reference-pitch">
        <span class="flex items-center gap-2">
          <lg-number-field
            id="settings-reference-pitch"
            [valueText]="hz"
            [formField]="settingsForm.referencePitch"
          />
          <span class="text-lg-fg-muted" aria-hidden="true">Hz</span>
        </span>
      </app-settings-row>
      <hr />
      <app-settings-row label="Tolerance">
        <app-segmented-pills
          class="w-48"
          label="Tolerance"
          [options]="tolerances"
          [formField]="settingsForm.tolerance"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Clef">
        <app-segmented-pills
          class="w-52"
          label="Clef"
          [options]="clefs"
          [formField]="settingsForm.clef"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Accidentals">
        <app-segmented-pills
          class="w-48"
          label="Accidentals"
          [options]="accidentals"
          [formField]="settingsForm.accidentals"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group title="Metronome">
      <app-settings-row label="Click sound" for="settings-click-sound">
        <select
          id="settings-click-sound"
          lgInput
          class="max-w-3/5"
          [formField]="settingsForm.clickSound"
        >
          @for (sound of sounds; track sound.value) {
            <option [value]="sound.value">{{ sound.title }}</option>
          }
        </select>
      </app-settings-row>
      @for (volume of volumes; track volume.label) {
        <hr />
        <label class="flex min-h-12 items-center gap-3 px-4">
          <span class="w-26 shrink-0">{{ volume.label }}</span>
          <input
            type="range"
            lgSlider
            step="0.01"
            class="min-w-0 flex-1"
            [formField]="volume.field"
          />
        </label>
      }
      <hr />
      <app-settings-row label="Vibration" for="settings-vibration">
        <input
          id="settings-vibration"
          type="checkbox"
          role="switch"
          lgSwitch
          [formField]="settingsForm.vibration"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="General"
      footnote="Bluetooth page-turner pedals: the left pedal sends ←, ↑ or Page Up, the right pedal →, ↓ or Page Down. Space always starts and stops, T taps the tempo."
    >
      <app-settings-row label="Keep screen awake" for="settings-keep-awake">
        <input
          id="settings-keep-awake"
          type="checkbox"
          role="switch"
          lgSwitch
          [formField]="settingsForm.keepAwake"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Pedal" for="settings-pedal">
        <select id="settings-pedal" lgInput class="max-w-3/5" [formField]="settingsForm.pedalMode">
          @for (mode of pedalModes; track mode.value) {
            <option [value]="mode.value">{{ mode.label }}</option>
          }
        </select>
      </app-settings-row>
    </app-settings-group>
    <p class="-mt-3 px-1 text-xs text-lg-fg-muted">
      Vibration works on Android only; iOS browsers can't vibrate.
    </p>
  </form>
</app-sheet>
