<header
  class="flex h-16 shrink-0 items-center justify-between border-b border-lg-border bg-lg-surface px-6 lg:px-8"
>
  <div class="flex items-center gap-3">
    <img ngSrc="icons/icon.svg" alt="" width="28" height="28" priority />
    <h1 class="text-lg font-semibold">Metronome &amp; Tuner</h1>
  </div>
  <div class="flex items-center gap-3">
    <span
      class="flex h-9 items-center gap-2 rounded-full border border-lg-border bg-lg-surface px-3.5 text-sm text-lg-fg-muted"
      role="status"
    >
      <span
        class="size-2 rounded-full"
        [class]="tuner.isListening() ? 'bg-lg-success' : 'bg-lg-control-border'"
      ></span>
      {{
        tuner.isListening()
          ? viewport.width() >= 1024
            ? 'Microphone on'
            : 'Mic on'
          : viewport.width() >= 1024
            ? 'Microphone off'
            : 'Mic off'
      }}
    </span>
    <app-header-icon-button icon="settings" label="Settings" (pressed)="ui.openSettings()" />
  </div>
</header>

<main class="min-h-0 flex-1 overflow-y-auto">
  <div class="mx-auto grid w-full max-w-328 gap-5 p-6 lg:grid-cols-2 lg:gap-6 lg:px-8">
    <app-metronome-panel [wide]="true" />
    <app-tuner-panel [wide]="true" />
  </div>
</main>

@if (viewport.finePointer()) {
  <footer
    class="hidden h-12 shrink-0 items-center justify-center gap-6 border-t border-lg-border text-sm text-lg-fg-muted lg:flex"
  >
    @for (shortcut of shortcuts; track shortcut.key) {
      <span class="flex items-center gap-2">
        <kbd lgKbd>
          {{ shortcut.key }}
        </kbd>
        {{ shortcut.action }}
      </span>
    }
  </footer>
}
