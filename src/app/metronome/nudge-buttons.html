@for (delta of deltas; track delta) {
  <button
    type="button"
    appSurface
    appHoldRepeat
    class="rounded-xl text-base tabular-nums"
    [style.height.px]="height()"
    [attr.aria-label]="`${delta > 0 ? 'Plus' : 'Minus'} ${abs(delta)} BPM`"
    (repeat)="store.nudge(delta)"
  >
    {{ delta > 0 ? `+${delta}` : `−${abs(delta)}` }}
  </button>
}
