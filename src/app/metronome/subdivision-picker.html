<fieldset
  class="m-0 grid min-w-0 gap-1 rounded-lg-surface border-0 bg-lg-surface-muted p-1 forced-colors:border forced-colors:border-[CanvasText]"
  [class]="horizontal() ? 'grid-cols-3' : 'grid-cols-6'"
>
  <legend class="sr-only">Subdivision</legend>
  @for (option of store.subdivisionOptions(); track option.value) {
    <label
      class="relative flex h-14 min-w-0 cursor-pointer items-center justify-center rounded-lg-control text-lg-fg-muted has-checked:bg-lg-surface has-checked:font-semibold has-checked:text-lg-fg has-checked:shadow-sm has-checked:lg-forced-selected has-focus-visible:outline-3 has-focus-visible:outline-offset-2 has-focus-visible:outline-lg-focus [&>input]:sr-only"
      [class]="horizontal() ? 'gap-2.5' : 'flex-col'"
    >
      <input
        type="radio"
        [name]="name"
        [checked]="store.subdivision() === option.value"
        (change)="store.setSubdivision(option.value)"
      />
      <span class="flex items-start leading-none" aria-hidden="true">
        <span class="font-music" [class]="option.value === 3 ? 'text-xl' : 'text-2xl'">{{
          option.symbol
        }}</span>
        @if (option.tuplet) {
          <span class="ms-0.5 text-xs font-bold">{{ option.tuplet }}</span>
        }
      </span>
      <span
        class="whitespace-nowrap"
        [class]="horizontal() ? 'text-sm' : 'text-xs tracking-tighter'"
      >
        {{ option.title }}
      </span>
    </label>
  }
</fieldset>
