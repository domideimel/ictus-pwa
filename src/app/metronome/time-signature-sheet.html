<app-sheet title="Time signature" closeLabel="Cancel" (closed)="closed.emit()">
  <form class="flex flex-col gap-6" (submit)="apply($event)">
    <p class="text-center text-lg-display-md font-semibold tabular-nums" aria-live="polite">
      {{ model().beats }}/{{ model().unit }}
    </p>
    <app-settings-group title="Meter">
      <app-settings-row label="Beats per bar" for="signature-beats">
        <lg-number-field id="signature-beats" [formField]="signatureForm.beats" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Beat unit">
        <app-segmented-pills
          class="w-48"
          label="Beat unit"
          [options]="units"
          [formField]="signatureForm.unit"
        />
      </app-settings-row>
    </app-settings-group>
    <button type="submit" lgButton variant="accent" [disabled]="signatureForm().invalid()">
      Use {{ model().beats }}/{{ model().unit }}
    </button>
  </form>
</app-sheet>
