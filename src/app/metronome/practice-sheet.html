<app-sheet title="Practice" (closed)="closed.emit()">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault()">
    @if (store.activePractice().length > 0) {
      <div
        class="flex items-center justify-between gap-3 rounded-lg-surface bg-lg-accent-surface ps-4 pe-1 text-lg-accent"
        role="status"
      >
        <span class="font-semibold">{{ activeSummary() }}</span>
        <button
          type="button"
          lgButton
          variant="ghost"
          class="underline underline-offset-2"
          (click)="store.turnOffPractice()"
        >
          Turn all off
        </button>
      </div>
    }
    <app-settings-group
      title="Gap click"
      footnote="Plays some bars, then stays silent so you keep time on your own."
    >
      <app-settings-row label="On" for="practice-gap-click">
        <input
          id="practice-gap-click"
          type="checkbox"
          role="switch"
          lgSwitch
          aria-label="Gap click"
          [formField]="practice.gapClick.enabled"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Play bars" for="practice-play-bars">
        <lg-number-field id="practice-play-bars" [formField]="practice.gapClick.play" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Mute bars" for="practice-mute-bars">
        <lg-number-field id="practice-mute-bars" [formField]="practice.gapClick.mute" />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Polyrhythm"
      footnote="3:2 plays three even clicks in a higher sound across every two beats."
    >
      <app-settings-row label="Pattern">
        <app-segmented-pills
          class="w-56"
          label="Polyrhythm"
          [options]="polyrhythms"
          [formField]="practice.polyrhythm"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Speed trainer"
      [footnote]="`Starts at the metronome tempo (${store.bpm()} BPM) and speeds up on the bar line.`"
    >
      <app-settings-row label="On" for="practice-speed-trainer">
        <input
          id="practice-speed-trainer"
          type="checkbox"
          role="switch"
          lgSwitch
          aria-label="Speed trainer"
          [formField]="practice.speedTrainer.enabled"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Raise by" for="practice-raise-by">
        <span class="flex items-center gap-2">
          <lg-number-field
            id="practice-raise-by"
            [valueText]="bpm"
            [formField]="practice.speedTrainer.step"
          />
          <span class="w-9 text-lg-fg-muted" aria-hidden="true">BPM</span>
        </span>
      </app-settings-row>
      <hr />
      <app-settings-row label="Every" for="practice-every">
        <span class="flex items-center gap-2">
          <lg-number-field
            id="practice-every"
            [valueText]="bars"
            [formField]="practice.speedTrainer.everyBars"
          />
          <span class="w-9 text-lg-fg-muted" aria-hidden="true">bars</span>
        </span>
      </app-settings-row>
      <hr />
      <app-settings-row label="Target BPM" for="practice-target">
        <lg-number-field
          id="practice-target"
          [largeStep]="10"
          [formField]="practice.speedTrainer.target"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Rest counter"
      footnote="Counts bars at the current tempo and meter with a big bar number, and signals your entrance."
    >
      <app-settings-row label="Bars tacet" for="practice-bars-tacet">
        <lg-number-field
          id="practice-bars-tacet"
          [largeStep]="10"
          [formField]="practice.restBars"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Click audible" for="practice-click-audible">
        <input
          id="practice-click-audible"
          type="checkbox"
          role="switch"
          lgSwitch
          [formField]="practice.restAudible"
        />
      </app-settings-row>
      <hr />
      <div class="p-3">
        <button type="button" lgButton variant="accent" class="w-full" (click)="startRest()">
          Start counting
        </button>
      </div>
    </app-settings-group>
  </form>
</app-sheet>
