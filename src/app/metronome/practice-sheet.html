<app-sheet title="Practice" (closed)="closed.emit()">
  <form class="flex flex-col gap-5" (submit)="$event.preventDefault()">
    @if (store.activePractice().length > 0) {
      <div
        class="flex items-center justify-between gap-3 rounded-xl bg-accent/15 ps-4 pe-1 text-accent-text"
        role="status"
      >
        <span class="text-15 font-semibold">{{ activeSummary() }}</span>
        <button
          type="button"
          class="h-11 px-3 text-15 font-semibold underline underline-offset-2"
          (click)="store.turnOffPractice()"
        >
          Turn all off
        </button>
      </div>
    }
    <app-settings-group
      title="Gap click"
      footnote="Plays some bars, then stays silent so you keep time on your own."
    >
      <app-settings-row label="On">
        <app-toggle-switch label="Gap click" [formField]="practice.gapClick.enabled" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Play bars">
        <app-number-stepper label="Play bars" [formField]="practice.gapClick.play" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Mute bars">
        <app-number-stepper label="Mute bars" [formField]="practice.gapClick.mute" />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Polyrhythm"
      footnote="3:2 plays three even clicks in a higher sound across every two beats."
    >
      <app-settings-row label="Pattern">
        <app-segmented-pills
          class="w-52"
          label="Polyrhythm"
          [options]="polyrhythms"
          [formField]="practice.polyrhythm"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Speed trainer"
      [footnote]="`Starts at the metronome tempo (${store.bpm()} BPM) and speeds up on the bar line.`"
    >
      <app-settings-row label="On">
        <app-toggle-switch label="Speed trainer" [formField]="practice.speedTrainer.enabled" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Raise by">
        <app-number-stepper label="Raise by" unit=" BPM" [formField]="practice.speedTrainer.step" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Every">
        <app-number-stepper
          label="Every"
          unit=" bars"
          [formField]="practice.speedTrainer.everyBars"
        />
      </app-settings-row>
      <hr />
      <app-settings-row label="Target BPM">
        <app-number-stepper
          label="Target BPM"
          [steps]="[1, 10]"
          [formField]="practice.speedTrainer.target"
        />
      </app-settings-row>
    </app-settings-group>

    <app-settings-group
      title="Rest counter"
      footnote="Counts bars at the current tempo and meter with a big bar number, and signals your entrance."
    >
      <app-settings-row label="Bars tacet">
        <app-number-stepper label="Bars tacet" [steps]="[1, 10]" [formField]="practice.restBars" />
      </app-settings-row>
      <hr />
      <app-settings-row label="Click audible">
        <app-toggle-switch label="Click audible" [formField]="practice.restAudible" />
      </app-settings-row>
      <hr />
      <div class="p-3">
        <button
          type="button"
          class="h-12 w-full rounded-xl bg-accent text-base font-semibold text-on-accent"
          (click)="startRest()"
        >
          Start counting
        </button>
      </div>
    </app-settings-group>
  </form>
</app-sheet>
