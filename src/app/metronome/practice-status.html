@if (chips().length > 0) {
  <div
    role="group"
    aria-label="Practice tools on"
    class="flex min-h-11 flex-wrap items-center justify-center gap-1.5"
  >
    @for (chip of chips(); track chip.tool) {
      <span
        class="flex h-8 items-center rounded-full bg-lg-accent-surface text-sm font-semibold text-lg-accent tabular-nums"
      >
        <button
          type="button"
          class="h-full rounded-s-full ps-3 pe-1"
          aria-haspopup="dialog"
          aria-description="Opens practice tools"
          (click)="open.emit()"
        >
          {{ chip.label }}
        </button>
        <button
          type="button"
          class="flex size-8 items-center justify-center rounded-full active:bg-lg-surface-muted"
          [attr.aria-label]="`Turn off ${chip.name}`"
          (click)="store.turnOffPractice(chip.tool)"
        >
          <app-icon name="close" [size]="14" [strokeWidth]="2.4" />
        </button>
      </span>
    }
    @if (chips().length > 1) {
      <button
        type="button"
        class="h-8 rounded-full px-2.5 text-sm font-semibold text-lg-fg-muted underline underline-offset-2"
        (click)="store.turnOffPractice()"
      >
        Turn all off
      </button>
    }
  </div>
}
