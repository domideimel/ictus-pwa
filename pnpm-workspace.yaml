allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# Temporary: Angular CLI 22.2.6 was published on 2026-11-04 and is still inside the
# minimumReleaseAge window. Remove after 2026-11-05 22:45 UTC.
minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.6'
  - '@angular-devkit/core@22.2.6'
  - '@angular-devkit/schematics@22.2.6'
  - '@angular/build@22.2.6'
  - '@angular/cli@22.2.6'
  - '@schematics/angular@22.2.6'

# GHSA-g3hv-75wg-m249: minimatch 7–11.0.0 can be made to hang by brace patterns. typescript-eslint
# still asks for ^10, which has no patched release, so lift it to 11 (same API, still CommonJS).
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
